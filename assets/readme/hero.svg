  <text x="48" y="145" fill="#f5f8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="58" font-weight="700">Codex Reset</text>
  <text x="48" y="208" fill="#4ee7c1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="58" font-weight="700">Radar</text>
