<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Codex Reset Radar for Obsidian</title>
  <desc id="desc">A dark technical title board showing a radar, countdown, public-signal labels, and the plugin's sidebar and status-bar capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182f"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ee7c1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4ee7c1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M120 0V400M240 0V400M360 0V400M480 0V400M600 0V400M720 0V400M840 0V400M960 0V400M1080 0V400" stroke="#c5d0ec" stroke-opacity=".055"/>
